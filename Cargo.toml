[package]
name = "illust-shelf-gtk"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/xiupos/illust-viewer-gtk"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rayon = "1.12.0"
relm4 = { version = "0.11", features = ["macros", "libadwaita", "gnome_47"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v5", "v7"] }
walkdir = "2.5.0"
